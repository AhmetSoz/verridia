<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Verridia — Bölüm 1: Sessiz Talim</title>
<style>
  :root{ --gece:#0a0913; --altin:#c9a35c; --kizil:#b8303c; --parsomen:#e9dfc4; --duman:#8d8399;
         --disp:Georgia,"Times New Roman",serif; --mono:"Cascadia Mono",Consolas,monospace; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--gece);color:var(--parsomen);font-family:var(--mono)}
  #c{display:block;width:100vw;height:100vh}
  #ui{position:fixed;inset:0;pointer-events:none}
  .kart{position:absolute;background:linear-gradient(180deg,rgba(10,9,19,.86),rgba(10,9,19,.6));
        border:1px solid rgba(201,163,92,.34);padding:10px 14px}
  #bas{top:16px;left:18px}
  #bas .eb{font-size:9px;letter-spacing:.3em;color:var(--altin);opacity:.85}
  #bas .ad{font-family:var(--disp);font-size:21px;letter-spacing:.14em;margin:4px 0 2px}
  #bas .yer{font-size:9.5px;letter-spacing:.12em;color:var(--duman)}
  #kontrol{top:16px;right:18px;font-size:9.5px;letter-spacing:.11em;color:var(--duman);line-height:1.85;text-align:right}
  #kontrol b{color:var(--parsomen);font-weight:600}
  #ipucu{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;
         color:var(--altin);opacity:0;transition:opacity .25s;text-shadow:0 2px 12px #000}
  #diyalog{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:min(860px,92vw);
           background:linear-gradient(180deg,rgba(8,8,14,.94),rgba(8,8,14,.86));
           border:1px solid rgba(201,163,92,.42);padding:15px 20px 17px;opacity:0;visibility:hidden;
           transition:opacity .25s}
  #diyalog.acik{opacity:1;visibility:visible}
  #dad{font-family:var(--disp);font-size:15px;letter-spacing:.12em;color:var(--altin);margin-bottom:7px}
  #dmetin{font-size:12.5px;line-height:1.75;letter-spacing:.03em;min-height:2.6em}
  #dilerle{margin-top:9px;font-size:9px;letter-spacing:.26em;color:var(--duman);text-align:right}
  #perde{position:fixed;inset:0;display:grid;place-items:center;z-index:9;
         background:radial-gradient(120% 90% at 50% 40%,#171331 0%,#0a0913 70%);transition:opacity 1s ease .3s}
  #perde.git{opacity:0;visibility:hidden}
  #perde h1{font-family:var(--disp);font-weight:400;font-size:clamp(34px,6vw,64px);letter-spacing:.22em;margin:0;
            background:linear-gradient(180deg,#f3e7c9,#c9a35c);-webkit-background-clip:text;background-clip:text;color:transparent}
  #perde h2{font-family:var(--mono);font-size:11px;letter-spacing:.5em;color:var(--kizil);margin:12px 0 0;text-indent:.5em}
  #perde .k{width:min(320px,60vw);height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,rgba(201,163,92,.7),transparent)}
  #perde .y{margin-top:16px;font-size:9.5px;letter-spacing:.3em;color:var(--duman);text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="kart" id="bas">
    <div class="eb">BİRİNCİ KİTAP · BÖLÜM 1</div>
    <div class="ad">Sessiz Talim</div>
    <div class="yer">Kartal-Yurdu · şafaktan önce</div>
  </div>
  <div class="kart" id="kontrol">
    <b>WASD</b> yürü · <b>Shift</b> koş<br>
    <b>Sol tık</b> kılıç · <b>E</b> konuş<br>
    <b>Sürükle</b> kamera · <b>Tekerlek</b> yakınlaş
  </div>
  <div id="ipucu">E — konuş</div>
  <div id="diyalog">
    <div id="dad">Ad</div>
    <div id="dmetin"></div>
    <div id="dilerle">SPACE / E — devam</div>
  </div>
</div>
<div id="perde"><div>
  <h1>VERRİDİA</h1>
  <h2>BÖLÜM 1</h2>
  <div class="k"></div>
  <div class="y">KARTAL-YURDU UYANIYOR…</div>
</div></div>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js",
            "three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
<script type="module" src="./bolum01.js"></script>
<script>
  (function(){ var p=document.getElementById('perde');
    var i=setInterval(function(){ if(window.__hazir){clearInterval(i); p.classList.add('git');} },120);
    setTimeout(function(){p.classList.add('git');},9000); })();
</script>
</body>
</html>

<title>Verridia: K&#305;z&#305;l Hafta &#8212; Bozk&#305;r Cephesi</title>
<style>
  /* Tek bir g&#246;rsel d&#252;nyaya ba&#287;lan&#305;r: &#351;afak &#246;ncesi bozk&#305;r. Tema ge&#231;i&#351;i yok &#8212; bilin&#231;li. */
  :root{
    --gece:#0a0913; --mor:#18142e; --ufuk:#d9925a; --kizil:#b8303c;
    --altin:#c9a35c; --parsomen:#e9dfc4; --duman:#8d8399;
    --disp: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:var(--gece);color:var(--parsomen);
       font-family:var(--mono);-webkit-font-smoothing:antialiased}
  #c{display:block;width:100vw;height:100vh}

  #hud{position:fixed;inset:0;pointer-events:none;display:grid;
       grid-template-rows:auto 1fr auto;padding:18px 20px}
  .satir{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}

  .kart{background:linear-gradient(180deg,rgba(10,9,19,.86),rgba(10,9,19,.62));
        border:1px solid rgba(201,163,92,.34);padding:11px 15px 12px;
        box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .kart .eyebrow{font-size:9.5px;letter-spacing:.30em;color:var(--altin);opacity:.85}

  .ad{font-family:var(--disp);font-size:26px;line-height:1;letter-spacing:.16em;
      color:var(--parsomen);margin:5px 0 2px}
  .alt{font-size:10.5px;letter-spacing:.22em;color:var(--kizil);text-transform:uppercase}
  .yer{font-size:10px;letter-spacing:.12em;color:var(--duman);margin-top:7px}

  #kuvvet{min-width:216px}
  .kuv{display:flex;justify-content:space-between;align-items:baseline;
       font-size:11px;letter-spacing:.14em;padding:3px 0}
  .kuv b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--parsomen)}
  .kuv span{color:var(--duman)}
  .cizgi{height:1px;background:linear-gradient(90deg,rgba(201,163,92,.5),transparent);margin:8px 0 9px}

  .taraf{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.13em;padding:3px 0}
  .cip{width:11px;height:11px;border:1px solid rgba(255,255,255,.22);flex:0 0 auto}

  #dip{justify-self:center;align-self:end;text-align:center}
  #dip .not{font-size:10px;letter-spacing:.15em;color:var(--duman)}
  #dip .vurgu{color:var(--altin)}

  /* a&#231;&#305;l&#305;&#351; kart&#305; */
  #perde{position:fixed;inset:0;display:grid;place-items:center;z-index:9;
         background:radial-gradient(120% 90% at 50% 40%,#1a1533 0%,#0a0913 70%);
         transition:opacity 1.1s ease .3s, visibility 0s linear 1.4s}
  #perde.git{opacity:0;visibility:hidden}
  #perde .ic{text-align:center;padding:0 24px}
  #perde h1{font-family:var(--disp);font-weight:400;font-size:clamp(38px,7vw,76px);
            letter-spacing:.22em;margin:0;text-wrap:balance;
            background:linear-gradient(180deg,#f3e7c9,#c9a35c);-webkit-background-clip:text;
            background-clip:text;color:transparent}
  #perde h2{font-family:var(--mono);font-weight:400;font-size:clamp(11px,1.6vw,15px);
            letter-spacing:.56em;color:var(--kizil);margin:14px 0 0;text-indent:.56em}
  #perde .kural{width:min(340px,62vw);height:1px;margin:26px auto 0;
                background:linear-gradient(90deg,transparent,rgba(201,163,92,.75),transparent)}
  #perde .yukleniyor{margin-top:18px;font-size:10px;letter-spacing:.3em;color:var(--duman)}
  #perde .yukleniyor::after{content:"";display:inline-block;width:1ch;animation:nokta 1.4s steps(4) infinite}
  @keyframes nokta{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @media (prefers-reduced-motion:reduce){#perde{transition:none}#perde .yukleniyor::after{animation:none}}
</style>

  </div>
</div>
